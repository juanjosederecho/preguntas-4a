<style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0;padding:16px}h1{font-size:1.6em}li{font-size:1.6em;line-height:1.35;margin:0 0 22px;font-weight:600}</style>
<h1 id=t></h1><ol id=l></ol><script>const D={"jhongilberto": {"n": "Jhon Gilberto", "q": ["Si abres un club de aeromodelismo para chicos que sueñan con ser pilotos, ¿en qué consistiría la fase empatizar? ¿Qué te gustaría saber de ellos?", "¿Qué problema o necesidad real tienen los jóvenes de Puno que quieren ser pilotos y que tu club podría atender?", "Cuéntame al menos tres ideas de actividades o servicios para tu club. ¿Cuál te parece la mejor y por qué?", "¿Cómo prototiparías tu club? Por ejemplo, ¿qué harías en una primera clase de prueba con pocos materiales?", "¿Cómo evaluarías si a los chicos les gustó tu club? ¿Qué preguntas les harías y qué mejorarías después?"]}, "jeandely": {"n": "Jeandely Shandall", "q": ["Si abres una asesoría para chicos que postulan a Psicología en la UNA Puno, ¿en qué consistiría la fase empatizar?", "¿Cuál es la mayor dificultad de los postulantes, por ejemplo en razonamiento verbal? Defínela en una frase.", "Propón tres ideas para ayudarles a estudiar mejor. ¿Cuál escogerías y por qué?", "¿Cómo harías un prototipo de tu asesoría, por ejemplo una clase de prueba de sinónimos?", "¿Cómo evaluarías si tu asesoría ayudó a los postulantes? ¿Qué cambiarías?"]}, "jazmin": {"n": "Jazmín", "q": ["Si abres un taller de técnicas de estudio y memoria para postulantes, ¿en qué consistiría la fase empatizar?", "¿Cuál es el problema principal de los postulantes cuando estudian o memorizan? Dilo en una frase.", "Propón tres ideas o juegos para mejorar la memoria y la concentración. ¿Cuál escogerías?", "¿Cómo harías un prototipo de tu taller con pocos materiales?", "¿Cómo evaluarías si tu taller mejoró la memoria de los participantes?"]}, "yudema": {"n": "Yudema Hayde", "q": ["Si creas un servicio de orientación para estudiantes que se sienten estresados, ¿en qué consistiría la fase empatizar?", "¿Qué problema emocional o de estudio es el más común en los estudiantes y tu servicio atendería?", "Dame tres ideas para ayudar a esos estudiantes. ¿Cuál elegirías?", "¿Cómo prototiparías tu servicio, por ejemplo una charla o taller de prueba en el colegio?", "¿Cómo evaluarías si tu servicio realmente ayudó? ¿Qué preguntarías a los participantes?"]}, "reyna": {"n": "Reyna Digna", "q": ["Si abres un taller de biología para escolares, ¿en qué consistiría la fase empatizar? ¿Qué te gustaría saber de los niños o jóvenes?", "¿Qué problema tienen los estudiantes para aprender biología que tu taller resolvería?", "Propón tres ideas de experimentos o actividades para tu taller. ¿Cuál sería la mejor y por qué?", "¿Cómo prototiparías tu taller con materiales sencillos, por ejemplo para mostrar una célula?", "¿Cómo evaluarías si los participantes aprendieron y se divirtieron? ¿Qué cambiarías?"]}, "fiorela": {"n": "Fiorela", "q": ["Si creas un negocio de recorridos guiados para contar la historia de Puno y del Tawantinsuyo, ¿en qué consistiría la fase empatizar?", "¿Qué problema o necesidad tienen los turistas o estudiantes que tu recorrido podría resolver?", "Dame tres ideas para que tus recorridos sean entretenidos y diferentes. ¿Cuál escogerías?", "¿Cómo harías un prototipo de tu recorrido, por ejemplo una visita de prueba con tus compañeros?", "¿Cómo evaluarías si tu recorrido gustó y la gente aprendió? ¿Qué mejorarías?"]}, "adan": {"n": "Adán Jhoel", "q": ["Si creas un servicio de entrenamiento para chicos que quieren estudiar Educación Física, ¿en qué consistiría la fase empatizar? ¿A quién observarías?", "¿Qué dificultad tienen esos chicos para aprobar el examen físico? Defínelo en una frase clara.", "Propón tres ideas para ayudarles a mejorar su fuerza, resistencia o estabilidad. ¿Cuál escogerías?", "¿Cómo harías un prototipo de tu servicio, por ejemplo una rutina de prueba en la cancha del colegio?", "¿Cómo evaluarías si tu rutina funciona? ¿Qué medirías antes y después?"]}, "yudith": {"n": "Yudith Alicia", "q": ["Si abres un servicio de mantenimiento y reparación de celulares, ¿en qué consistiría la fase empatizar? ¿Qué les preguntarías a tus clientes?", "¿Cuál es el problema más común que tienen las personas con su celular y que tu negocio solucionaría?", "Propón tres ideas para tu servicio, por ejemplo cómo atender o qué ofrecer. ¿Cuál elegirías?", "¿Cómo prototiparías tu servicio de forma sencilla, por ejemplo con los celulares de tu familia o compañeros?", "¿Cómo evaluarías si tus clientes quedaron contentos? ¿Qué cambiarías después de escucharlos?"]}, "beatriz": {"n": "Beatriz", "q": ["Si abres un pequeño negocio de cuidado facial, ¿en qué consistiría la fase empatizar? ¿Qué les preguntarías a tus clientas?", "¿Cuál es el problema de piel o de cuidado más común en Puno que tu negocio ayudaría a resolver?", "Dame tres ideas de servicios o productos para tu negocio. ¿Cuál elegirías y por qué?", "¿Cómo harías un prototipo de tu servicio, por ejemplo una rutina de cuidado facial de prueba?", "¿Cómo evaluarías si tus clientas quedaron satisfechas? ¿Qué mejorarías?"]}, "yesenia": {"n": "Yesenia", "q": ["Si empiezas un negocio de refrescos saludables con poca inversión, ¿en qué consistiría la fase empatizar? ¿Qué observarías en tus clientes?", "¿Qué necesidad o problema de tus clientes resolvería tu negocio? Explícalo en una frase.", "Dame tres ideas de productos o formas de vender. ¿Cuál aportaría más valor y por qué?", "¿Cómo harías la fase prototipar de tu venta de refrescos saludables antes de invertir más dinero?", "¿Cómo evaluarías si a la gente le gustó tu producto? ¿Qué harías con las críticas?"]}, "willian": {"n": "Willian Abel", "q": ["Si abres una academia precadete para postulantes a la FAP, ¿en qué consistiría la fase empatizar? ¿Con quiénes hablarías y qué les preguntarías?", "Después de escuchar a los postulantes, ¿cuál crees que sería el problema principal que tu academia debe resolver? Dilo en una sola frase.", "Dame tres ideas diferentes para que tu academia ayude a los jóvenes a ingresar a la FAP. ¿Cuál elegirías y por qué?", "¿Cómo harías un prototipo sencillo y barato de tu academia para probarlo antes de abrirla de verdad?", "¿En qué consistiría la fase evaluar en tu academia precadete? ¿Cómo sabrías si tu idea funciona y qué cambiarías?"]}, "jhon": {"n": "Jhon Erwin", "q": ["Si abres una academia de preparación física para jóvenes que quieren entrar a la Policía o a fuerzas especiales, ¿en qué consistiría la fase empatizar?", "Según lo que descubras de esos jóvenes, ¿cuál sería el problema más importante que tu academia debe resolver?", "Dime tres ideas para entrenar o motivar a tus alumnos. ¿Con cuál te quedarías y por qué?", "¿Cómo harías un prototipo de tu academia, por ejemplo una semana de entrenamiento de prueba? ¿Qué necesitarías?", "¿Cómo evaluarías si tu academia realmente ayuda a los postulantes? ¿Qué mirarías para saber si mejoraron?"]}};const a=new URLSearchParams(location.search).get('a');const s=D[a];
document.getElementById('t').textContent=s?'🎤 '+s.n+': responde en voz alta':'Alumno no encontrado';if(s)s.q.forEach(q=>{const li=document.createElement('li');li.textContent=q;document.getElementById('l').appendChild(li)})</script></html>
